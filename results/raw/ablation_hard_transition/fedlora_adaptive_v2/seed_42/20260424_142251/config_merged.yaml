model:
  name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  torch_dtype: float32
  device: mps
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
  - q_proj
  - v_proj
  bias: none
training:
  local_epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  max_seq_length: 256
  warmup_ratio: 0.03
federated:
  num_rounds: 15
  num_clients: 10
  clients_per_round: 10
  aggregation_method: fedlora_adaptive_v2
evaluation:
  eval_every: 1
  eval_batch_size: 4
  metrics:
  - loss
  - perplexity
checkpointing:
  save_every: 10
  keep_last_n: 3
seed: 42
experiment:
  name: ablation_hard_transition
  description: FedLoRA-Adaptive v2 with hard transition (transition_rounds=0)
data:
  dataset_name: tatsu-lab/alpaca
  dataset_split: train
  max_samples: 3000
  partition_method: iid
  eval_split: null
  eval_samples: 300
fedlora_adaptive_v2:
  switch_threshold: 0.01
  warmup_rounds: 3
  transition_rounds: 0
  stability_threshold: 1.1
  per_layer_enabled: true
  layer_names:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
