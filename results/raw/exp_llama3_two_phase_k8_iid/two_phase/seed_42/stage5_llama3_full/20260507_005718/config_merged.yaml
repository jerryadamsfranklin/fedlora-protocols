model:
  name: meta-llama/Llama-3.2-3B
  torch_dtype: float16
  device: mps
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  bias: none
training:
  local_epochs: 1
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  max_seq_length: 256
  warmup_ratio: 0.03
  lora_param_dtype: float32
federated:
  num_rounds: 15
  num_clients: 10
  clients_per_round: 10
  aggregation_method: two_phase
evaluation:
  eval_every: 5
  eval_batch_size: 4
  metrics:
  - loss
  - perplexity
checkpointing:
  save_every: 10
  keep_last_n: 3
seed: 42
data:
  dataset_name: tatsu-lab/alpaca
  dataset_split: train
  max_samples: 3000
  partition_method: iid
  eval_split: null
  eval_samples: 300
experiment:
  name: exp_llama3_two_phase_k8_iid
  description: Two-Phase K=8 at LLaMA-3.2-3B scale, IID
two_phase:
  phase_boundary: 8
