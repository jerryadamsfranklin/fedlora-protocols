model:
  name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  torch_dtype: float32
  device: mps
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  bias: none
training:
  local_epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  max_seq_length: 256
  warmup_ratio: 0.03
federated:
  num_rounds: 15
  num_clients: 10
  clients_per_round: 10
  aggregation_method: curriculum_rank
evaluation:
  eval_every: 1
  eval_batch_size: 4
  metrics:
  - loss
  - perplexity
checkpointing:
  save_every: 10
  keep_last_n: 3
seed: 42
data:
  dataset_name: tatsu-lab/alpaca
  dataset_split: train
  max_samples: 3000
  partition_method: iid
  eval_split: null
  eval_samples: 300
experiment:
  name: exp_curriculum_gradual
  description: 'Curriculum rank: gradual 4-phase {3:4, 6:8, 10:12, 15:16}'
curriculum_rank:
  rank_schedule:
    3: 4
    6: 8
    10: 12
    15: 16
  final_rank: 16
