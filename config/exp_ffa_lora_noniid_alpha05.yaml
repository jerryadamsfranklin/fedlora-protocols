_inherit: base_config_4layers.yaml

experiment:
  name: "exp_ffa_lora_noniid_alpha05"
  description: "FFA-LoRA baseline on Alpaca-3k, non-IID alpha=0.5"

lora:
  target_modules:
    - "q_proj"
    - "v_proj"

federated:
  aggregation_method: "ffa_lora"

data:
  dataset_name: "tatsu-lab/alpaca"
  dataset_split: "train"
  max_samples: 3000
  partition_method: "label_skew"
  partition_alpha: 0.5
  eval_split: null
  eval_samples: 300
