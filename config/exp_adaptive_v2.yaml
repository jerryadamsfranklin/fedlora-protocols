_inherit: base_config.yaml

experiment:
  name: "exp_adaptive_v2"
  description: "FedLoRA-Adaptive v2 (soft transition + stability + per-layer)"

data:
  dataset_name: "tatsu-lab/alpaca"
  dataset_split: "train"
  max_samples: 3000
  partition_method: "iid"
  eval_split: null
  eval_samples: 300

training:
  local_epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  max_seq_length: 256

federated:
  num_rounds: 15
  num_clients: 10
  clients_per_round: 10
  aggregation_method: "fedlora_adaptive_v2"

evaluation:
  eval_every: 1
  eval_batch_size: 4

fedlora_adaptive_v2:
  switch_threshold: 0.01
  warmup_rounds: 3
  transition_rounds: 3
  stability_threshold: 1.1
  per_layer_enabled: true
  layer_names: ["q_proj", "k_proj", "v_proj", "o_proj"]

