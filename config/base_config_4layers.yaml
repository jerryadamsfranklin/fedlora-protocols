# Four attention LoRA targets (q,k,v,o) for meaningful per-layer / hybrid experiments.
# Aligns training protocol with exp_adaptive_v2 (15 rounds, Alpaca 3k, short seq) unless overridden.
_inherit: base_config.yaml

lora:
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

data:
  dataset_name: "tatsu-lab/alpaca"
  dataset_split: "train"
  max_samples: 3000
  partition_method: "iid"
  eval_split: null
  eval_samples: 300

training:
  local_epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  max_seq_length: 256

federated:
  num_rounds: 15
  num_clients: 10
  clients_per_round: 10

evaluation:
  eval_every: 1
  eval_batch_size: 4
