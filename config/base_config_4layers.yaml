# Shared training-protocol base used by most TinyLlama experiment configs.
# target_modules is q_proj, v_proj, matching every run reported in the
# manuscript (verified by measured byte totals). Earlier revisions listed
# q,k,v,o here but did not pass target_modules into model construction;
# the current runner does, so the value was corrected to keep these configs
# reproducing the reported runs. See analysis/README.md.
_inherit: base_config.yaml

lora:
  target_modules:
    - "q_proj"
    - "v_proj"

data:
  dataset_name: "tatsu-lab/alpaca"
  dataset_split: "train"
  max_samples: 3000
  partition_method: "iid"
  eval_split: null
  eval_samples: 300

training:
  local_epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  max_seq_length: 256

federated:
  num_rounds: 15
  num_clients: 10
  clients_per_round: 10

evaluation:
  eval_every: 1
  eval_batch_size: 4
