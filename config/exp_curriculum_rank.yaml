_inherit: base_config_4layers.yaml

experiment:
  name: "exp_curriculum_rank"
  description: "Curriculum rank (server-side effective rank via SVD truncation + padding)"

federated:
  aggregation_method: "curriculum_rank"

curriculum_rank:
  # Inclusive thresholds: 1-5 => r=4, 6-10 => r=8, 11-15 => r=16.
  # Clients still train with full-rank adapters; server truncates effective rank
  # and pads back to full rank so shapes stay loadable.
  rank_schedule:
    5: 4
    10: 8
    15: 16
  final_rank: 16
