# Configuration for downstream benchmark evaluation.
# Used by scripts/evaluate_checkpoint.py via Hydra/OmegaConf if integrated;
# otherwise referenced manually.

evaluation:
  benchmarks:
    - "mmlu"
    - "arc_easy"
    - "boolq"
  num_examples: 500
  seed: 42

# Sanity baselines (zero-shot accuracy on the base model with NO adapter).
# Run once and record; used as a floor in tables.
baselines:
  tinyllama_1b_chat:
    # Baseline (no adapter), num_examples=500, seed=42:
    # results/downstream/baseline_no_adapter_500.json
    mmlu: 0.25
    arc_easy: 0.274
    boolq: 0.626

