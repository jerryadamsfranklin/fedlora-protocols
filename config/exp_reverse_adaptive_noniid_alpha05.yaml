_inherit: base_config_4layers.yaml

experiment:
  name: "exp_reverse_adaptive_noniid_alpha05"
  description: "Adaptive switching, Non-IID Dirichlet alpha=0.5"

data:
  partition_method: "label_skew"
  partition_alpha: 0.5

federated:
  aggregation_method: "reverse_adaptive"

reverse_adaptive:
  switch_threshold: 0.01
  warmup_rounds: 5
  transition_rounds: 0
  stability_threshold: 1.1
